<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klean</title>
<meta name="theme-color" id="themeColor" content="#E8ECEB">
<script>
/* mode, colour scheme, code colours and fonts, applied before first paint (the %…% values come from src/config.ts) */
(function(){var d=document.documentElement,t=%DEFAULT_THEME%,s=%DEFAULT_SCHEME%,c=%DEFAULT_CODE_SCHEME%,f={},V=%FONT_VARS%,S=%FONT_STACKS%,r;try{t=localStorage.getItem(%THEME_KEY%)||t;s=localStorage.getItem(%SCHEME_KEY%)||s;c=localStorage.getItem(%CODE_SCHEME_KEY%)||c;f=JSON.parse(localStorage.getItem(%FONTS_KEY%))||f}catch(e){}
for(r in V)if(S.hasOwnProperty(f[r]))d.style.setProperty(V[r],S[f[r]]);
d.dataset.codeScheme=c;d.dataset.scheme=s;d.dataset.theme=t==='dark'||(t!=='light'&&matchMedia(%DARK_QUERY%).matches)?'dark':'light'})();
</script>
<link rel="icon" id="favicon" href="/src/assets/logo.svg">
<script type="module" src="/src/main.tsx"></script>
</head>

<div id="root"></div>
</body>
